name: Release to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC Trusted Publishing -- no NPM_TOKEN secret needed or stored
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi

      # Rebuilds and re-runs the offline suite here rather than trusting
      # an artifact from the CI workflow -- this workflow triggers off a
      # tag push, which is a separate event from the branch push CI
      # already validated, so there's no prior run's output to reuse.
      - name: Confirm the required macula-cli release actually exists
        # Found by the release audit before v0.15.0: nothing checked that
        # MIN_MACULA_CLI_VERSION names a release that has actually been
        # tagged and published. Publishing this package while it doesn't
        # would ship a doctor/postinstall check that can never pass. Reads
        # the constant straight from source rather than duplicating the
        # version number here, so this can't drift from what the code
        # actually enforces.
        run: |
          MIN_VERSION="$(grep -oP 'MIN_MACULA_CLI_VERSION = "\K[0-9.]+' src/macula_cli.ts)"
          if [ -z "$MIN_VERSION" ]; then
            echo "::error::could not extract MIN_MACULA_CLI_VERSION from src/macula_cli.ts"
            exit 1
          fi
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/macula-io/macula-cli/releases/tags/v${MIN_VERSION}")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::macula-cli v${MIN_VERSION} (this package's MIN_MACULA_CLI_VERSION) has no GitHub release yet (HTTP $STATUS) -- tag and release macula-cli first"
            exit 1
          fi
          echo "macula-cli v${MIN_VERSION} release confirmed"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Trusted Publishing (OIDC) needs npm CLI >=11.5.0. Node 20's
      # bundled npm on GitHub-hosted runners was older than that (10.8.2) --
      # verified 2026-08-29 when v0.3.1 failed here: provenance signing
      # succeeded (that's an older, separate feature) but the actual
      # publish PUT came back 404, because the old CLI had no idea how to
      # do the OIDC-for-auth exchange and fell through to an unauthenticated
      # request. Now on Node 24.20.0 (bumped for node:sqlite -- see
      # CHANGELOG.md's 0.17.0 entry), `npm@latest` (12.x, which needs
      # Node >=22) would work too, but there's no reason to move off the
      # already-verified-working 11.x line just because the version floor
      # that forced it is gone.
      - run: npm install -g npm@11
      - run: npm --version

      # Auto-detects GitHub Actions' OIDC token when id-token: write is
      # granted and this package has a Trusted Publisher configured on
      # npmjs.com (Settings -> Trusted Publisher, repo macula-io/macula-mcp,
      # workflow release.yml) -- no login step, no stored secret, npm
      # exchanges the OIDC token for a short-lived publish credential
      # itself. --provenance attaches a signed build-provenance
      # attestation (this exact commit/workflow run) to the published
      # package, free once OIDC is already wired up.
      - run: npm publish --access public --provenance
