name: Release to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm OIDC Trusted Publishing -- no NPM_TOKEN secret needed or stored
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches package.json, server.json and the Claude Code plugin
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match package.json version ($PKG_VERSION)"
            exit 1
          fi
          for SERVER_VERSION in $(node -p "const s = require('./server.json'); [s.version, ...s.packages.map(p => p.version)].join(' ')"); do
            if [ "$SERVER_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
              echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match a server.json version ($SERVER_VERSION)"
              exit 1
            fi
          done
          PLUGIN_VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$PLUGIN_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match .claude-plugin/plugin.json version ($PLUGIN_VERSION)"
            exit 1
          fi

      # Rebuilds and re-runs the offline suite here rather than trusting
      # an artifact from the CI workflow -- this workflow triggers off a
      # tag push, which is a separate event from the branch push CI
      # already validated, so there's no prior run's output to reuse.
      # (No macula-cli release-existence check here any more -- this
      # package no longer shells out to a separately installed
      # macula-cli, so there is no external release for a tagged version
      # of this package to depend on.)
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Trusted Publishing (OIDC) needs npm CLI >=11.5.0. Node 20's
      # bundled npm on GitHub-hosted runners was older than that (10.8.2) --
      # verified 2026-08-29 when v0.3.1 failed here: provenance signing
      # succeeded (that's an older, separate feature) but the actual
      # publish PUT came back 404, because the old CLI had no idea how to
      # do the OIDC-for-auth exchange and fell through to an unauthenticated
      # request. Now on Node 24.20.0 (bumped for node:sqlite -- see
      # CHANGELOG.md's 0.17.0 entry), `npm@latest` (12.x, which needs
      # Node >=22) would work too, but there's no reason to move off the
      # already-verified-working 11.x line just because the version floor
      # that forced it is gone.
      - run: npm install -g npm@11
      - run: npm --version

      # Auto-detects GitHub Actions' OIDC token when id-token: write is
      # granted and this package has a Trusted Publisher configured on
      # npmjs.com (Settings -> Trusted Publisher, repo macula-io/macula-mcp,
      # workflow release.yml) -- no login step, no stored secret, npm
      # exchanges the OIDC token for a short-lived publish credential
      # itself. --provenance attaches a signed build-provenance
      # attestation (this exact commit/workflow run) to the published
      # package, free once OIDC is already wired up.
      - run: npm publish --access public --provenance

      # The official MCP Registry lists this package as io.macula/macula-mcp.
      # The io.macula namespace is proven by DNS: an Ed25519 public key in a
      # "v=MCPv1" TXT record on the macula.io apex, whose private key is the
      # MCP_REGISTRY_KEY secret. The registry checks that the npm package's
      # mcpName equals server.json's name, so this runs after npm publish.
      # npm can take 20 minutes to serve a fresh version (v0.43.1's first
      # registry publish was refused with a 404 for it), so the step waits
      # until npm serves this exact version before publishing.
      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          for attempt in $(seq 1 40); do
            npm view "@macula-io/mcp@${VERSION}" version >/dev/null 2>&1 && break
            echo "npm does not serve @macula-io/mcp@${VERSION} yet (attempt ${attempt}/40)"
            sleep 30
          done
          npm view "@macula-io/mcp@${VERSION}" version
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain macula.io --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish
