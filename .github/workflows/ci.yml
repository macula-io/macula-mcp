name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Offline only: parseWatchOutput's NDJSON parsing (src/macula_cli.test.ts).
      # No live-fleet test here -- every tool in this repo shells out to
      # macula-cli, which isn't installed on this runner and shouldn't need
      # to be for a unit-test job; live verification is "run the built MCP
      # server against a real macula-cli," done by hand, same convention
      # macula-cli's own README documents for itself.
      - run: npm test

  shellcheck:
    name: shellcheck install.sh / uninstall.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: dist

  powershell-parse:
    name: parse-check install.ps1 / uninstall.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Syntax-only validation -- actually running install.ps1 would need
      # a real published npm package to install, which isn't available in
      # this job. Same convention as macula-cli's own powershell-parse job.
      - shell: pwsh
        run: |
          $allErrors = @()
          foreach ($f in @("install.ps1", "uninstall.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
