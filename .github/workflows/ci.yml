name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - run: npm ci
      - run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - run: npm ci
      # Offline only -- every tool in this repo talks to the mesh
      # in-process via @macula-io/ts (macula_ts_client.ts), which this
      # suite mocks at the module boundary (see mesh_call.test.ts and
      # its siblings); live verification against the real fleet is done
      # by hand, not in CI.
      - run: npm test

  shellcheck:
    name: shellcheck install.sh / uninstall.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: dist

  powershell-parse:
    name: parse-check install.ps1 / uninstall.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Syntax-only validation -- actually running install.ps1 would need
      # a real published npm package to install, which isn't available in
      # this job. Same convention as macula-cli's own powershell-parse job.
      - shell: pwsh
        run: |
          $allErrors = @()
          foreach ($f in @("install.ps1", "uninstall.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
